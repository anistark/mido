[package]
name = "mido"
version = "0.4.1"
edition = "2024"
rust-version = "1.93"
description = "Markdown In, Document Out. A terminal Markdown reader."
license = "MIT"
repository = "https://github.com/anistark/mido"
homepage = "https://anistark.github.io/mido"
documentation = "https://anistark.github.io/mido"
keywords = ["markdown", "tui", "terminal", "viewer", "ratatui"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    "/.github",
    "/assets",
    "/docs/_*",
    "/docs/assets",
    "/docs/tapes",
    "/docs/*.njk",
    "/docs/*.js",
    "/docs/package.json",
    "/docs/pnpm-lock.yaml",
    "/docs/.node-version",
    "/docs/.gitignore",
    "/justfile",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
emojis = "0.9.0"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
include_dir = "0.7.4"
mermaid-text = "0.57.0"
mmdflux = { version = "2.6.1", default-features = false }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
open = "5.4.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
ureq = "3.4.2"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

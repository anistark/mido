[package]
name = "mido"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
description = "Markdown In, Document Out. A terminal Markdown reader."
license = "MIT"
keywords = ["markdown", "tui", "terminal", "viewer", "ratatui"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
include_dir = "0.7.4"
mermaid-text = "0.57.0"
mmdflux = { version = "2.6.1", default-features = false }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
open = "5.4.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

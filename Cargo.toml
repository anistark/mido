[workspace]
members = ["crates/mido-core"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/anistark/mido"
homepage = "https://anistark.github.io/mido"

[package]
name = "mido"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Markdown In, Document Out. A terminal Markdown reader."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://anistark.github.io/mido"
keywords = ["markdown", "tui", "terminal", "viewer", "ratatui"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
    "/.github",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/assets",
    "/docs/_*",
    "/docs/assets",
    "/docs/tapes",
    "/docs/*.njk",
    "/docs/*.js",
    "/docs/package.json",
    "/docs/pnpm-lock.yaml",
    "/docs/.node-version",
    "/docs/.gitignore",
    "/justfile",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
include_dir = "0.7.4"
mido-core = { path = "crates/mido-core", version = "0.4.1" }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
open = "5.4.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
terminal-light = "1.9.1"
toml = "1.1.6"
ureq = "3.4.2"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_mangen = "0.3.3"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
unicode-width = "0.2.2"

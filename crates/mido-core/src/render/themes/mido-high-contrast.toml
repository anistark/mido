# High contrast for low vision: white on black, and every color that carries text at least 7:1 (WCAG AAA). Paints its own background.
schema = 1
kind = "dark"
syntax = "catppuccin-frappe"

[palette]
white = "#ffffff"
muted = "#e0e0e0"
faint = "#bdbdbd"
yellow = "#ffd75f"
cyan = "#5fd7ff"
green = "#87ff87"
magenta = "#ff87ff"
orange = "#ffaf5f"
red = "#ff8787"
blue = "#87afff"
pink = "#ffafd7"
black = "#000000"
tint = "#0a0a0a"
surface = "#1c1c1c"
raised = "#262626"
selected = "#3a3a3a"
line = "#9e9e9e"

[colors]
bg = "black"
fg = "white"
fg_muted = "muted"
fg_faint = "faint"
accent = "yellow"
h1 = "yellow"
h2 = "cyan"
h3 = "magenta"
h4 = "white"
h5 = "muted"
h6 = "muted"
h1_fg = "black"
link = "cyan"
link_url = "faint"
code_fg = "orange"
code_bg = "tint"
code_border = "line"
surface = "surface"
quote_bar = "green"
quote_fg = "muted"
rule = "line"
table_border = "line"
list_marker = "yellow"
status_bg = "raised"
status_fg = "white"
search_bg = "yellow"
search_fg = "black"
search_current_bg = "orange"
overlay_border = "yellow"
selected_bg = "selected"
alert_note = "blue"
alert_tip = "green"
alert_important = "magenta"
alert_warning = "yellow"
alert_caution = "red"
math = "pink"
label_bg = "raised"
label_value_bg = "selected"

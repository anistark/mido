# mido's light theme, on the terminal's own background.
schema = 1
kind = "light"
syntax = "catppuccin-latte"

[palette]
text = "#1f2335"
muted = "#4c5374"
faint = "#8a8fa8"
green = "#0f8a5f"
teal = "#0b7f8a"
violet = "#7c3aed"
blue = "#1e66f5"
leaf = "#2f8f3a"
amber = "#b7791f"
orange = "#b4431a"
red = "#d20f39"
berry = "#c2338f"
paper = "#f4fbf8"
tint = "#eef0f5"
raised = "#e3e6ee"
line = "#cfd3e0"
border = "#b8bdcf"
highlight = "#ffe08a"
highlight_current = "#ffb370"

[colors]
bg = "default"
fg = "text"
fg_muted = "muted"
fg_faint = "faint"
accent = "green"
h1 = "green"
h2 = "teal"
h3 = "violet"
h4 = "text"
h5 = "muted"
h6 = "muted"
h1_fg = "paper"
link = "teal"
link_url = "faint"
code_fg = "orange"
code_bg = "tint"
code_border = "line"
surface = "tint"
quote_bar = "leaf"
quote_fg = "muted"
rule = "line"
table_border = "border"
list_marker = "green"
status_bg = "raised"
status_fg = "text"
search_bg = "highlight"
search_fg = "text"
search_current_bg = "highlight_current"
overlay_border = "green"
selected_bg = "raised"
alert_note = "blue"
alert_tip = "leaf"
alert_important = "violet"
alert_warning = "amber"
alert_caution = "red"
math = "berry"
label_bg = "raised"
label_value_bg = "line"

# Dracula, from draculatheme.com/contribute. The muted text shade is derived from the foreground.
schema = 1
kind = "dark"
syntax = "dracula"

[palette]
background = "#282a36"
darker = "#21222c"
raised = "#343746"
current_line = "#44475a"
foreground = "#f8f8f2"
muted = "#bdc0cf"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

[colors]
bg = "background"
fg = "foreground"
fg_muted = "muted"
fg_faint = "comment"
accent = "purple"
h1 = "purple"
h2 = "pink"
h3 = "cyan"
h4 = "foreground"
h5 = "muted"
h6 = "muted"
h1_fg = "background"
link = "cyan"
link_url = "comment"
code_fg = "green"
code_bg = "darker"
code_border = "current_line"
surface = "raised"
quote_bar = "yellow"
quote_fg = "muted"
rule = "current_line"
table_border = "comment"
list_marker = "purple"
status_bg = "current_line"
status_fg = "foreground"
search_bg = "yellow"
search_fg = "background"
search_current_bg = "orange"
overlay_border = "purple"
selected_bg = "current_line"
alert_note = "cyan"
alert_tip = "green"
alert_important = "purple"
alert_warning = "orange"
alert_caution = "red"
math = "pink"
label_bg = "current_line"
label_value_bg = "comment"

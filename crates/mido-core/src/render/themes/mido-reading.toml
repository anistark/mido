# A warm, low-contrast paper palette for long reads. Paints its own background.
schema = 1
kind = "light"
syntax = "gruvbox-light"

[palette]
paper = "#f3ead8"
ink = "#4a3f33"
muted = "#6e6152"
faint = "#9a8b76"
sienna = "#8b5e34"
sage = "#4f7a6f"
plum = "#7d5575"
slate = "#5b6e8c"
olive = "#9aa86f"
moss = "#6b8a4e"
ochre = "#a87b2a"
brick = "#a8483f"
rust = "#9c4a2f"
rose = "#8f4f73"
cream = "#f8f1e3"
tint = "#ebe0ca"
raised = "#e6dac1"
line = "#d6c8ab"
border = "#c9b99a"
chip = "#dccfb3"
highlight = "#ecd48a"
highlight_current = "#e3a86b"
dark = "#3b3228"

[colors]
bg = "paper"
fg = "ink"
fg_muted = "muted"
fg_faint = "faint"
accent = "sienna"
h1 = "sienna"
h2 = "sage"
h3 = "plum"
h4 = "ink"
h5 = "muted"
h6 = "muted"
h1_fg = "cream"
link = "slate"
link_url = "faint"
code_fg = "rust"
code_bg = "tint"
code_border = "line"
surface = "tint"
quote_bar = "olive"
quote_fg = "muted"
rule = "line"
table_border = "border"
list_marker = "sienna"
status_bg = "raised"
status_fg = "ink"
search_bg = "highlight"
search_fg = "dark"
search_current_bg = "highlight_current"
overlay_border = "sienna"
selected_bg = "raised"
alert_note = "slate"
alert_tip = "moss"
alert_important = "plum"
alert_warning = "ochre"
alert_caution = "brick"
math = "rose"
label_bg = "raised"
label_value_bg = "chip"

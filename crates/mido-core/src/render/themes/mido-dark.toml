# mido's default dark theme, on the terminal's own background.
schema = 1
kind = "dark"
syntax = "catppuccin-mocha"

[palette]
text = "#cdd6f4"
muted = "#a6adc8"
faint = "#6c7086"
mint = "#5cffb0"
aqua = "#62e8e2"
mauve = "#cba6f7"
blue = "#89b4fa"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
red = "#f38ba8"
pink = "#f5c2e7"
ink = "#060f0c"
base = "#1e1e2e"
tint = "#242636"
raised = "#313244"
line = "#45475a"
border = "#585b70"

[colors]
bg = "default"
fg = "text"
fg_muted = "muted"
fg_faint = "faint"
accent = "mint"
h1 = "mint"
h2 = "aqua"
h3 = "mauve"
h4 = "text"
h5 = "muted"
h6 = "muted"
h1_fg = "ink"
link = "aqua"
link_url = "faint"
code_fg = "peach"
code_bg = "tint"
code_border = "line"
surface = "tint"
quote_bar = "green"
quote_fg = "muted"
rule = "line"
table_border = "border"
list_marker = "mint"
status_bg = "raised"
status_fg = "text"
search_bg = "yellow"
search_fg = "base"
search_current_bg = "peach"
overlay_border = "mint"
selected_bg = "raised"
alert_note = "blue"
alert_tip = "green"
alert_important = "mauve"
alert_warning = "yellow"
alert_caution = "red"
math = "pink"
label_bg = "raised"
label_value_bg = "line"

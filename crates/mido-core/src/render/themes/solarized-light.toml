# Solarized light, from ethanschoonover.com/solarized. The chip shade is derived from base2.
schema = 1
kind = "light"
syntax = "solarized-light"

[palette]
base3 = "#fdf6e3"
base2 = "#eee8d5"
chip = "#e4dcc4"
base1 = "#93a1a1"
base00 = "#657b83"
base01 = "#586e75"
yellow = "#b58900"
orange = "#cb4b16"
red = "#dc322f"
magenta = "#d33682"
violet = "#6c71c4"
blue = "#268bd2"
cyan = "#2aa198"
green = "#859900"

[colors]
bg = "base3"
fg = "base01"
fg_muted = "base00"
fg_faint = "base1"
accent = "blue"
h1 = "blue"
h2 = "cyan"
h3 = "violet"
h4 = "base01"
h5 = "base00"
h6 = "base00"
h1_fg = "base3"
link = "blue"
link_url = "base1"
code_fg = "orange"
code_bg = "base2"
code_border = "base1"
surface = "base2"
quote_bar = "green"
quote_fg = "base00"
rule = "base1"
table_border = "base1"
list_marker = "blue"
status_bg = "base2"
status_fg = "base01"
search_bg = "yellow"
search_fg = "base3"
search_current_bg = "orange"
overlay_border = "blue"
selected_bg = "base2"
alert_note = "blue"
alert_tip = "green"
alert_important = "violet"
alert_warning = "yellow"
alert_caution = "red"
math = "magenta"
label_bg = "base2"
label_value_bg = "chip"

# Gruvbox dark, medium contrast, from github.com/morhetz/gruvbox.
schema = 1
kind = "dark"
syntax = "gruvbox-dark"

[palette]
bg0_h = "#1d2021"
bg0 = "#282828"
bg0_s = "#32302f"
bg1 = "#3c3836"
bg2 = "#504945"
bg3 = "#665c54"
fg = "#ebdbb2"
fg3 = "#bdae93"
gray = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
aqua = "#8ec07c"
orange = "#fe8019"

[colors]
bg = "bg0"
fg = "fg"
fg_muted = "fg3"

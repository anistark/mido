# Solarized dark, from ethanschoonover.com/solarized. The chip shade is derived from base02.
schema = 1
kind = "dark"
syntax = "solarized-dark"

[palette]
base03 = "#002b36"
base02 = "#073642"
chip = "#0b4453"
base01 = "#586e75"
base0 = "#839496"
base1 = "#93a1a1"
yellow = "#b58900"
orange = "#cb4b16"
red = "#dc322f"
magenta = "#d33682"
violet = "#6c71c4"
blue = "#268bd2"
cyan = "#2aa198"
green = "#859900"

[colors]

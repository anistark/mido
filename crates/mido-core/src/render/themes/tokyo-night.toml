# Tokyo Night, from github.com/folke/tokyonight.nvim. two-face has no Tokyo Night
# syntax theme, and Catppuccin Macchiato uses the same hues for the same scopes.
schema = 1
kind = "dark"
syntax = "catppuccin-macchiato"

[palette]
bg = "#1a1b26"
bg_dark = "#16161e"
bg_storm = "#1f2335"
bg_highlight = "#292e42"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
fg_gutter = "#3b4261"
comment = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
blue1 = "#2ac3de"
magenta = "#bb9af7"
purple = "#9d7cd8"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
red = "#f7768e"

[colors]
bg = "bg"
fg = "fg"
fg_muted = "fg_dark"
fg_faint = "comment"
accent = "blue"
h1 = "blue"
h2 = "cyan"
h3 = "magenta"
h4 = "fg"
h5 = "fg_dark"
h6 = "fg_dark"
h1_fg = "bg"
link = "blue1"
link_url = "comment"
code_fg = "orange"
code_bg = "bg_dark"
code_border = "bg_highlight"
surface = "bg_storm"
quote_bar = "green"
quote_fg = "fg_dark"
rule = "fg_gutter"
table_border = "fg_gutter"
list_marker = "blue"
status_bg = "bg_highlight"
status_fg = "fg"
search_bg = "yellow"
search_fg = "bg"
search_current_bg = "orange"
overlay_border = "blue"
selected_bg = "bg_highlight"
alert_note = "blue"
alert_tip = "green"
alert_important = "magenta"
alert_warning = "yellow"
alert_caution = "red"
math = "purple"
label_bg = "bg_highlight"
label_value_bg = "fg_gutter"

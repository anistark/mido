[package]
name = "mido-core"
description = "Parse, layout and theme engine behind the mido Markdown reader, with no terminal dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mido-core"
keywords = ["markdown", "ratatui", "layout", "theme", "renderer"]
categories = ["text-processing", "rendering"]

[dependencies]
emojis = "0.9.0"
mermaid-text = "0.57.0"
mmdflux = { version = "2.6.1", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui-core = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.6"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.48.0"
